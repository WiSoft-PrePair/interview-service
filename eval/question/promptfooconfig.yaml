# 생성된 면접 질문 자체의 품질 판정 
# 실행: promptfoo eval -n 10  (처음 10개)  /  promptfoo eval  (전체)  →  promptfoo view
description: 면접 질문 품질 판정

# echo: 모델을 부르지 않고 CSV의 질문을 그대로 출력으로 넘김 → 아래 assert가 채점
prompts:
  - '{{question}}'
providers:
  - echo

tests: file://questions.csv # (job, tag, question)

defaultTest:
  options:
    provider: # 판정 모델 | 생성 모델(Sol)과 다르게
      id: openai:chat:gpt-6.1-terra
      config:
        temperature: 1 # promptfoo 채점 기본값 0을 이 모델이 거부함 (1만 지원)
  assert:
    # 사고 수준 | 블룸 분류 기준, "적용" 이상이면 통과
    - type: llm-rubric
      metric: 사고 수준
      value: |
        평가 대상은 {{job}} 직무의 면접 질문입니다. 답변이 아니라 질문 자체를 평가합니다.
        이 질문에 제대로 답하려면 어느 단계의 사고까지 필요한지 고르세요. 여러 단계가 섞여 있으면 가장 높은 단계를 고르세요.
        문장 형식("설명해 주세요" 등)이 아니라 실제로 요구하는 사고로 판단하세요.
        - 기억: 사실이나 정의를 떠올리면 답할 수 있음
        - 이해: 개념을 자기 말로 풀어 설명하면 답할 수 있음
        - 적용: 아는 개념이나 방법을 주어진 상황에 써야 함
        - 분석: 문제를 나누고 원인이나 요인을 가려내야 함
        - 평가: 선택지를 비교하고 근거를 들어 판단해야 함
        - 창조: 새로운 해결책이나 구조를 설계해야 함

        [자동 탈락] 정의, 용어, 순서, 차이만 묻는 질문은 기억·이해입니다.

        [예시]
        - 탈락(기억): "트랜잭션의 ACID 속성을 말해 주세요."
        - 탈락(이해): "캐시를 쓰는 이유를 설명해 주세요."
        - 통과(적용): "조회가 잦고 수정이 드문 상품 정보에 캐시를 둔다면 만료 시간을 어떻게 정하겠습니까?"
        - 통과(평가): "트래픽이 몰리는 이벤트 페이지에서 정합성과 응답 속도 중 무엇을 우선하겠습니까? 근거와 함께 답해 주세요."

        적용 이상이면 pass=true, score=1, 아니면 pass=false, score=0입니다.
        reason은 한국어로, 고른 단계를 맨 앞에 쓰세요.

    # 명확성 | QGEval 명확성·간결성 참고
    - type: llm-rubric
      metric: 명확성
      value: |
        평가 대상은 {{job}} 직무의 면접 질문입니다. 답변이 아니라 질문 자체를 평가합니다.
        지원자가 한 번 읽고 "무엇에 대해, 어떤 방향으로 답해야 하는지" 알 수 있으면 통과입니다.

        [자동 탈락]
        - 범위가 너무 넓어 어떤 주제로든 답할 수 있음 (예: "~에 대해 어떻게 생각하나요?")
        - 한 질문에 묻는 것이 여러 개 섞여 초점이 흐림
        - 군더더기나 꼬인 문장 때문에 의도를 다시 읽어야 파악됨

        [통과로 봐야 하는 경우]
        - 난이도가 높아도 묻는 바가 분명하면 통과
        - 정답이 하나가 아니고 답이 열려 있는 것은 면접 질문의 정상 형태이므로 통과

        [예시]
        - 탈락: "좋은 API란 무엇이라고 보시나요?" (범위가 너무 넓음)
        - 탈락: "배포할 때나 그 전후에 장애나 그 밖의 일이 생기면 대응이나 예방 같은 것을 어떻게 하시나요?" (초점이 여러 개)
        - 통과: "배포 직후 오류율이 오르면 롤백할지 원인을 먼저 찾을지 어떻게 판단하겠습니까?"

        통과면 pass=true, score=1, 탈락이면 pass=false, score=0입니다. reason은 한국어로 쓰세요.

    # 중요도 | 해당 직무에서 실제로 마주치는 문제인가
    - type: llm-rubric
      metric: 중요도
      value: |
        평가 대상은 {{job}} 직무의 면접 질문입니다. 답변이 아니라 질문 자체를 평가합니다.
        이 직무의 신입이 실제 업무나 프로젝트에서 마주칠 만한 문제나 판단을 다루면 통과입니다.

        [자동 탈락]
        - 직무와 무관한 일상·사무 상황
        - 업무에 쓰이지 않는 지엽적 사실이나 역사, 개인 취향

        [예시]
        - 탈락: "개발 도구의 로고가 바뀐 이유는 무엇일까요?" (지엽적)
        - 탈락: "팀 점심 메뉴를 정할 때 어떻게 의견을 모으시겠습니까?" (직무 무관)
        - 통과: "외부 API 응답이 가끔 느려질 때 사용자 요청을 어떻게 처리하겠습니까?"

        통과면 pass=true, score=1, 탈락이면 pass=false, score=0입니다. reason은 한국어로 쓰세요.
