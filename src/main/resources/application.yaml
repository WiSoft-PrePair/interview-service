### 기본 설정 (서버·로그) ###
server:
  port: 7300

logging:
  level:
    root: INFO
    io.wisoft.prepair.interview: ${APP_LOG_LEVEL:INFO}

### Spring Common (애플리케이션·프로필·JSON·파일 업로드·메일) ###
spring:
  application:
    name: prepair-interview

  profiles:
    default: local

  jackson:
    property-naming-strategy: SNAKE_CASE

  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 155MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

### 외부 서비스 (멤버·OpenAI) ###
external:
  member-service:
    url: ${MEMBER_SERVICE_URL}
    api-key: ${MEMBER_SERVICE_API_KEY}

  openai:
    api-key: ${OPENAI_API_KEY}
    api-url: https://api.openai.com/v1/chat/completions
    model: gpt-4o-mini
    whisper-url: https://api.openai.com/v1/audio/transcriptions
    whisper-model: whisper-1

### AWS (S3·CloudFront) ###
cloud:
  aws:
    s3:
      bucket: ${S3_BUCKET}
      region: ${S3_REGION}
    cloudfront:
      media-base-url: https://prepair.woomin.dev
