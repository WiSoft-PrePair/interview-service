plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.wisoft.prepair'
version = '0.0.1-SNAPSHOT'
description = '‎PrePair backend API server'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.ai:spring-ai-bom:2.0.2'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // 스케줄러 중복 실행 방지 — PostgreSQL JDBC 기반 잠금
    implementation 'net.javacrumbs.shedlock:shedlock-spring:7.11.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:7.11.0'

    // Spring AI (OpenAI 연동) - 임베딩 및 LLM 모델 지원
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    // PostgreSQL 벡터 타입 매핑
    implementation 'org.hibernate.orm:hibernate-vector'

    // OpenAI 응답 파싱 등 기존 com.fasterxml.jackson 기반 코드에서 사용하는 Jackson 2
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // 이메일
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // AWS S3
    implementation 'software.amazon.awssdk:s3:2.26.12'
    runtimeOnly 'org.postgresql:postgresql'

    // 헬스 체크
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 재시도
    implementation 'org.springframework.retry:spring-retry:2.0.10'

    // 롬복
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 로컬 .env 로딩 — Spring Boot 4용
    developmentOnly 'me.paulschwarz:springboot4-dotenv:5.1.0'

    // 테스트용 DB 자동 실행
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('jar') {
    enabled = false
}
