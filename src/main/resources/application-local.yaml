spring:
  datasource:
    url: jdbc:postgresql://localhost:55432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: false # 쿼리 성능 분석 시 true로 켜서 쿼리 수·실행 시간 확인
    open-in-view: false # 트랜잭션 종료 시 커넥션 반환, 컨트롤러에서 지연 로딩 불가
